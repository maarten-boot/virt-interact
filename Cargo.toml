[workspace]
resolver = "3"
members = ["crates/vi-core", "crates/vi-ssh", "crates/vi-backend", "crates/vi-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/maarten-boot/virt-interact"

[workspace.dependencies]
vi-core = { path = "crates/vi-core" }
vi-ssh = { path = "crates/vi-ssh" }
vi-backend = { path = "crates/vi-backend" }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
dirs = "7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
# SSH: ring instead of the default aws-lc-rs (no cmake/NASM needed on Windows)
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
eframe = "0.35"   # 0.36+ needs rustc 1.95; local toolchain is 1.93

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
