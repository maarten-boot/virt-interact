[workspace]
resolver = "3"
members = ["crates/vi-core", "crates/vi-ssh", "crates/vi-backend", "crates/vi-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/maarten-boot/virt-interact"

[workspace.dependencies]
vi-core = { path = "crates/vi-core" }
vi-ssh = { path = "crates/vi-ssh" }
vi-backend = { path = "crates/vi-backend" }
eframe = "0.35"   # 0.36+ needs rustc 1.95; local toolchain is 1.93

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
