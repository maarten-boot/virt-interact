[package]
name = "vi-gui"
description = "virt-interact desktop GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "virt-interact"
path = "src/main.rs"

[dependencies]
vi-core.workspace = true
vi-ssh.workspace = true
vi-backend.workspace = true
vi-vsphere.workspace = true
eframe.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "process", "io-util", "net"] }
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
# Already in the tree (eframe); a safe killpg for the viewer's group.
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
