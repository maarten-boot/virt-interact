[package]
name = "vi-vsphere"
description = "virt-interact vSphere: HTTPS with certificate pinning, read-only SOAP API (SPEC-021..023)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
vi-core.workspace = true
vi-ssh.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
ring = "0.17"
# TLS with the ring provider (no aws-lc: no cmake/NASM on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
