# Release archives (Plan 5.1/5.2, SPEC-002, TC-120).
# A pushed tag v<version> (equal to the Cargo version) tests and packages
# every platform, creates a draft GitHub release with the archives and the
# Changes.md section, checks the six files and their checksums, and only
# then publishes it as latest (SPEC-002, Plan 7.3, TC-123).
# "Run workflow" (workflow_dispatch) packages without a release, to try it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package ${{ matrix.pkg }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04: glibc 2.35, so the binary also runs on older distributions.
          - { os: ubuntu-22.04, pkg: linux }
          - { os: windows-latest, pkg: windows }
          - { os: macos-latest, pkg: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME != Cargo version $v"; exit 1; }
          bash scripts/release_notes.sh "$v" > /dev/null

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # Third-party licence notices for the archive (about.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Package
        run: bash scripts/package.sh ${{ matrix.pkg }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: virt-interact-${{ matrix.pkg }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release_notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "virt-interact $GITHUB_REF_NAME" --notes-file notes.md
      - name: Check the files and checksums, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release.sh "$GITHUB_REF_NAME"
