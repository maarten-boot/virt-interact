# CI for virt-interact (Plan 0.2, SPEC-002, TC-010)
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on 22.04 (glibc 2.35): the same base as the release archive,
        # so CI tests and packages what is released (crosscheck 03, C3).
        os: [ubuntu-22.04, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          # MSRV check (workspace rust-version)
          - os: ubuntu-latest
            toolchain: "1.92"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          # SPEC-002: macOS archives are universal (arm64 + x86_64, the
          # latter cross-compiled on the aarch64 runner)
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # Third-party licence notices for the archive (about.toml).
      - uses: taiki-e/install-action@v2
        if: matrix.toolchain == 'stable'
        with:
          tool: cargo-about@0.9.3

      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # --no-fail-fast: one failing test binary must not hide the others
        run: cargo test --workspace --locked --no-fail-fast

      # TC-120: every push also builds the release archive of its platform.
      - name: Package
        if: matrix.toolchain == 'stable'
        shell: bash
        run: bash scripts/package.sh ${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }} dist

      - name: Upload archive
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: virt-interact-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # vSphere simulator tests (Plan 8.6, TC-133): vcsim from govmomi, built
  # from a pinned commit (go install refuses the module's replace
  # directives), then the tests that need it (VI_VCSIM).
  vsphere-sim:
    name: vSphere simulator (vcsim)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Build vcsim (govmomi 3e19bc8)
        run: |
          git init -q "$RUNNER_TEMP/govmomi"
          cd "$RUNNER_TEMP/govmomi"
          git fetch -q --depth 1 https://github.com/vmware/govmomi 3e19bc8377fca88309e6d00bc897063fef0e2d64
          git checkout -q FETCH_HEAD
          cd vcsim && go build -o "$RUNNER_TEMP/vcsim" .
          "$RUNNER_TEMP/vcsim" -h 2>&1 | head -n 3 || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests against vcsim (ESXi and vCenter mode)
        env:
          VI_VCSIM: ${{ runner.temp }}/vcsim
        run: |
          set -o pipefail
          cargo test --locked -p vi-vsphere -p vi-backend -- --nocapture 2>&1 | tee test.log
          # Every simulator test must really have run.
          if grep -q "skipped: set VI_VCSIM" test.log; then exit 1; fi
