# CI for virt-interact (Plan 0.2, SPEC-002, TC-010)
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          # MSRV check (workspace rust-version)
          - os: ubuntu-latest
            toolchain: "1.92"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          # SPEC-002: macOS archives are universal (arm64 + x86_64, the
          # latter cross-compiled on the aarch64 runner)
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # --no-fail-fast: one failing test binary must not hide the others
        run: cargo test --workspace --locked --no-fail-fast

      # TC-120: every push also builds the release archive of its platform.
      - name: Package
        if: matrix.toolchain == 'stable'
        shell: bash
        run: bash scripts/package.sh ${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }} dist

      - name: Upload archive
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: virt-interact-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
