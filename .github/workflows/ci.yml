# CI for virt-interact (Plan 0.2, SPEC-002, TC-010)
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          # MSRV check (workspace rust-version)
          - os: ubuntu-latest
            toolchain: "1.92"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          # SPEC-002: also build macOS x86_64 (cross-compiled on the aarch64 runner)
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # --no-fail-fast: one failing test binary must not hide the others
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build release binary
        if: matrix.toolchain == 'stable'
        run: cargo build --release --locked -p vi-gui

      - name: Build macOS x86_64 binary (cross)
        if: runner.os == 'macOS' && matrix.toolchain == 'stable'
        run: cargo build --release --locked -p vi-gui --target x86_64-apple-darwin

      - name: Upload binary
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: virt-interact-${{ matrix.os }}
          path: |
            target/release/virt-interact
            target/release/virt-interact.exe
            target/x86_64-apple-darwin/release/virt-interact
          if-no-files-found: error
